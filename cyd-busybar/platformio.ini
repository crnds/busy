; cyd-busybar — BUSY Bar display clone for the ESP32-2432S028R (CYD 2.8")
; Flash: pio run -t upload && pio run -t uploadfs
; Always 115200 baud — this board's USB-serial is unreliable at 921600.

[env:esp32-2432s028r]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.1.0

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D USE_HSPI_PORT=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    ; Backlight is PWM'd by us on GPIO21 — do not let TFT_eSPI own it.
    -D TFT_RGB_ORDER=TFT_BGR
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SMOOTH_FONT=0
    -D CORE_DEBUG_LEVEL=1
    -D DISABLE_ALL_LIBRARY_WARNINGS
    -I src
