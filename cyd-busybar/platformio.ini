; cyd-busybar — BUSY Bar clone firmware for the CYD 2.8" (ESP32-2432S028R)
;
; TFT_eSPI is configured entirely from build_flags (USER_SETUP_LOADED) so the
; library folder is never edited — a library reinstall cannot silently change
; the pinout.

[platformio]
default_envs = cyd
data_dir     = data

[env:cyd]
platform  = espressif32@6.5.0
board     = esp32dev
framework  = arduino
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
monitor_speed = 115200
; 115200 rather than 921600: the CH340 on this board is not reliable at high
; upload rates on every cable/host combination, and a failed flash costs more
; than the extra minute.
upload_speed  = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    paulstoffregen/XPT2046_Touchscreen@0.0.0-alpha+sha.26b691b2c8
    bblanchon/ArduinoJson@^7.0.4
    esp32async/ESPAsyncWebServer@^3.6.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBUSYBAR_BUILD=1

    ; ── TFT_eSPI: ILI9341 on the CYD's HSPI bus ──────────────────────────
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; This board's panel is RGB-ordered: with TFT_eSPI's default (BGR bit in
    ; MADCTL) red renders as blue. CYD clone batches vary here -- this flag
    ; is the one line to flip if a different board shows red/blue swapped.
    -DTFT_RGB_ORDER=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

    ; Built-in bitmap faces only, and only the two the roles in gfx.h use --
    ; Font 4 is not loaded because no role draws a large number.
    ; LOAD_GFXFF stays on because setTextFont()
    ; only clears the free-font pointer under that flag — without it, font 1
    ; is not guaranteed to mean GLCD. See DESIGN.md §4.1.
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=0

    ; Async web server
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1

build_unflags =
    -std=gnu++11
build_src_flags =
    -std=gnu++17
